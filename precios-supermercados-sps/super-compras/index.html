<body>
<main>
<p>Súper Compras ahora vive en</p>
<p><a href="https://jchernandez-portfolio.github.io/precios-supermercados-sps/super-compras/">https://jchernandez-portfolio.github.io/precios-supermercados-sps/super-compras/</a></p>
<p>Si guardaste la app en tu teléfono, vuelve a instalarla desde la dirección nueva.</p>
</main>
<script>
// Conserva la ruta (#/p/…, #/buscar?q=…) y borra la copia vieja del service worker.
(function () {
  var target = 'https://jchernandez-portfolio.github.io/precios-supermercados-sps/super-compras/' + location.hash;
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.getRegistrations().then(function (list) {
      return Promise.all(list.map(function (r) { return r.unregister(); }));
    }).catch(function () {}).then(function () { location.replace(target); });
    setTimeout(function () { location.replace(target); }, 1500);
  } else {
    location.replace(target);
  }
})();
</script>
</body>
